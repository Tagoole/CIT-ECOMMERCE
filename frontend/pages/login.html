<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIT E-Commerce | Login</title>
    <link rel="stylesheet" href="../css/pages/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to your CIT E-Commerce account</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-form__group">
          <label class="auth-form__label" for="identifier">Email or Username</label>
          <input
            class="auth-form__input"
            type="text"
            id="identifier"
            name="identifier"
            placeholder="you@example.com or username"
            required
          />
          <span class="auth-form__error" id="identifierError"></span>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label" for="password">Password</label>
          <input
            class="auth-form__input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
          <span class="auth-form__error" id="passwordError"></span>
        </div>

        <button type="submit" class="btn btn--primary">Log In</button>
        <p class="auth-status" id="loginStatus"></p>
      </form>

      <p class="auth-alt">
        Don't have an account? <a class="auth-alt__link" href="register.html">Create one</a>
      </p>
    </main>

    <script src="../js/auth/login.js"></script>
  </body>
</html>
